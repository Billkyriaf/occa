name: FPGA Build

on:
  push:
    tags:
      - 'fpga-build-*'

permissions:
  contents: read

concurrency:
  group: fpga-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OCCA XRT Build
    runs-on: [self-hosted, fpga-builder]
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      XILINX_XRT: /opt/xilinx/xrt
      BUILD_ROOT: /builds/occa

    steps:
      - name: Checkout OCCA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner and workspace
        run: |
          set -euo pipefail

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Tag: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Workspace: $GITHUB_WORKSPACE"

          case "$GITHUB_WORKSPACE" in
            /work/*) ;;
            *)
              echo "ERROR: Workspace is not under /work"
              exit 1
              ;;
          esac

          docker version
          docker image inspect occa-builder:ubuntu18.04 >/dev/null

      - name: Build OCCA in Ubuntu 18.04
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,src=/mnt/data2/kyrvas/github-runner/work,dst=/work \
            --mount type=bind,src=/mnt/data2/kyrvas/github-runner/builds,dst=/builds \
            --mount type=bind,src=/opt/cmake-3.26.3-linux-x86_64,dst=/opt/cmake-3.26.3-linux-x86_64,readonly \
            --mount type=bind,src=/mnt/data2/Xilinx_2022.2,dst=/mnt/data2/Xilinx_2022.2,readonly \
            --mount type=bind,src=/mnt/data2/Vivado2022.2.sh,dst=/mnt/data2/Vivado2022.2.sh,readonly \
            --mount type=bind,src=/opt/xilinx/xrt,dst=/opt/xilinx/xrt,readonly \
            --mount type=bind,src=/usr/lib/x86_64-linux-gnu/libboost_filesystem.so.1.65.1,dst=/usr/local/lib/libboost_filesystem.so.1.65.1,readonly \
            --mount type=bind,src=/usr/lib/x86_64-linux-gnu/libboost_system.so.1.65.1,dst=/usr/local/lib/libboost_system.so.1.65.1,readonly \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e TAG="$TAG" \
            -e HOME=/tmp \
            -e XILINX_XRT=/opt/xilinx/xrt \
            -e LD_LIBRARY_PATH=/opt/xilinx/xrt/lib:/usr/local/lib \
            -w "$GITHUB_WORKSPACE" \
            occa-builder:ubuntu18.04 \
            bash -c '
              set -euo pipefail

              CMAKE=/opt/cmake-3.26.3-linux-x86_64/bin/cmake
              BUILD_DIR="/builds/occa/$TAG"

              echo "=== Build environment ==="
              ldd --version | head -1
              gcc --version | head -1
              g++ --version | head -1
              "$CMAKE" --version | head -1

              test -f "$XILINX_XRT/lib/libxrt_coreutil.so"
              test -d "$XILINX_XRT/include"

              mkdir -p "$BUILD_DIR"

              echo "=== Configure OCCA ==="

              "$CMAKE" -S "$GITHUB_WORKSPACE" \
                -B "$BUILD_DIR/build" \
                -G "Unix Makefiles" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=/usr/bin/gcc-7 \
                -DCMAKE_CXX_COMPILER=/usr/bin/g++-7 \
                -DCMAKE_INSTALL_PREFIX="$BUILD_DIR/install" \
                -DOCCA_ENABLE_XRT=ON \
                -DXRT_INCLUDE_DIR="$XILINX_XRT/include" \
                -DXRT_COREUTIL_LIBRARY="$XILINX_XRT/lib/libxrt_coreutil.so" \
                -DOCCA_ENABLE_OPENMP=OFF \
                -DOCCA_ENABLE_OPENCL=OFF \
                -DOCCA_ENABLE_CUDA=OFF \
                -DOCCA_ENABLE_HIP=OFF \
                -DOCCA_ENABLE_DPCPP=OFF \
                -DOCCA_ENABLE_METAL=OFF \
                -DOCCA_ENABLE_FORTRAN=OFF \
                -DOCCA_ENABLE_TESTS=OFF \
                -DOCCA_ENABLE_EXAMPLES=OFF

              echo "=== Verify XRT backend ==="

              grep -Eq \
                "^#define OCCA_XRT_ENABLED[[:space:]]+1$" \
                "$BUILD_DIR/build/include/occa/defines/compiledDefines.hpp"

              echo "=== Build ==="
              "$CMAKE" --build "$BUILD_DIR/build" --parallel 8

              echo "=== Install ==="
              "$CMAKE" --install "$BUILD_DIR/build"

              LIB="$BUILD_DIR/install/lib/libocca.so"
              test -f "$LIB"

              echo "=== Verify GLIBC compatibility ==="

              readelf --version-info "$LIB" \
                | grep -oE "GLIBC_[0-9]+\.[0-9]+" \
                | sort -Vu

              if readelf --version-info "$LIB" \
                  | grep -oE "GLIBC_[0-9]+\.[0-9]+" \
                  | sort -Vu \
                  | awk -F_ '"'"'$2+0 > 2.27 { bad=1 } END { exit !bad }'"'"'
              then
                echo "ERROR: OCCA requires GLIBC newer than 2.27"
                exit 1
              fi

              echo "=== Save metadata ==="

              {
                echo "Repository: $GITHUB_REPOSITORY"
                echo "Tag: $TAG"
                echo "Commit: $GITHUB_SHA"
                echo "Build date: $(date -u --iso-8601=seconds)"
                echo "Build OS: Ubuntu 18.04"
                echo "Compiler: GCC 7"
                echo "XRT: $XILINX_XRT"
              } > "$BUILD_DIR/build-info.txt"

              echo "=== Build completed ==="
              ls -lh "$LIB"
              du -sh "$BUILD_DIR"
            '
